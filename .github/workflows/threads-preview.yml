name: 쓰레드 원고 미리보기 (DM)
# 게시하지 않고, 원고를 다시 만들어 운영자 개인 DM(THREADS_ALERT_CHAT_ID)으로만 보낸다. 커밋도 하지 않는다.
#   gh workflow run threads-preview.yml -R stockgame4343-blip/whyrise [-f date=YYYYMMDD]
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD, 비우면 가장 최근 원고 날짜'
        default: ''
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate manuscript and send preview DM
        env:
          DATE: ${{ inputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS_ALERT_CHAT_ID: ${{ secrets.THREADS_ALERT_CHAT_ID }}
        run: |
          if [ -z "$DATE" ]; then DATE=$(ls public/marketing | grep -E '^[0-9]{8}$' | sort | tail -1); fi
          node scripts/marketing_digest.js "$DATE"
          node scripts/threads_publish.js "$DATE" --preview-dm
