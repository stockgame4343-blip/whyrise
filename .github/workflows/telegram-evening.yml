name: 저녁 마감 복기 텔레그램 자동 게시

# 평일 저녁, 마감 복기(상한가·2일 연속·1년 급등 단골)를 텍스트로 채널에 게시.
#   - 데이터: stock-rise raw + whyrise rise-history(LLM 정제 사유) + 로컬 stock-history
#   - 휴장일 가드: 스크립트가 캘린더(kr_holidays.json) + 네이버 실측 2중 차단
#   - 이미지 없음(텍스트 전용) — Playwright 불필요
# 중복 게시는 public/data/_telegram-evening.json 마커로 방지(크론 이중 발동 안전).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '전송 안 하고 캡션만 산출(검증)'
        type: boolean
        default: false
      force:
        description: '마커·휴장일 가드 무시하고 강제 게시'
        type: boolean
        default: false
      date:
        description: '샘플용 과거 날짜 YYYYMMDD (비우면 오늘)'
        type: string
        default: ''
  repository_dispatch:
    types: [tg-evening]      # 외부 cron-job.org → GitHub dispatch (GitHub 크론 누락 대비 이중화)
  workflow_run:              # 마감 빌드가 19시 넘어 끝난 날 — 마감 정리(오늘의 대장)가 끝난 뒤 19:00~22:00 이면 게시(마커로 하루 1번)
    workflows: ["오늘의 대장 텔레그램 자동 게시"]   # 빌드 완료가 아니라 마감 정리 다음에 — 저녁 정리가 마감 정리보다 먼저 나가지 않게
    types: [completed]
    branches: [master]
  schedule:
    - cron: '0 10 * * 1-5'   # 평일 KST 19:00
    - cron: '30 10 * * 1-5'  # 평일 KST 19:30 — 백업(첫 크론 누락 대비, 마커로 중복 방지)

env:
  TZ: Asia/Seoul
  TG_DELIVERY_TOKEN: ${{ github.token }}

concurrency:
  group: telegram-evening
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write     # 운영 점검이 마감 빌드를 다시 걸 때
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 빌드 완료 트리거는 저녁 정리 시간(19:00~22:00)에만 — 낮 동안의 15분 빌드마다 불리므로
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HM=$(date +%H%M)
            if [ "$HM" -lt 1900 ] || [ "$HM" -ge 2200 ]; then echo "저녁 정리 시간 밖($HM) — 스킵"; exit 0; fi
          fi
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date=${{ inputs.date }}"
          node scripts/telegram_evening_recap.js $ARGS

      # 중복 방지 마커 커밋(게시됐을 때만 변경됨). dry-run/스킵이면 변경 없음 → no-op.
      - name: Commit marker
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/_telegram-evening.json 2>/dev/null || true
          git diff --staged --quiet && echo "게시 안 됨/변경 없음 — 커밋 스킵" && exit 0
          git commit -m "chore: 저녁 복기 텔레그램 게시 마커 ($(date +%Y%m%d))"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if git -c rebase.autoStash=true rebase "origin/$BRANCH"; then
              git push origin "HEAD:$BRANCH" && echo "마커 push 성공" && exit 0
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "::error::마커 push 실패 — 재실행 전 채널 확인 필요"; exit 1

      # 저녁 운영 점검 — 19:00 외부 디스패치(가장 정확한 시계)에서만. 오늘 텔레그램 마감 정리·쓰레드·블로그 원고가
      # 다 나갔는지 보고, 빠진 게 있으면 운영자 개인 DM 한 통(공개 채널 X). 마감 빌드가 안 돌았으면 직접 다시 건다.
      - name: Ops check (operator DM only when something is missing)
        if: ${{ !cancelled() && github.event_name != 'workflow_run' && inputs.dry_run != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS_ALERT_CHAT_ID: ${{ secrets.THREADS_ALERT_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          THREADS_AUTOPUBLISH: ${{ vars.THREADS_AUTOPUBLISH }}
        run: |
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD   # 다른 런이 남긴 최신 기록으로
          node scripts/ops_check.js
