name: ORGO daily marketing
on:
  schedule:
    - cron: '37 7,8 * * 1-5' # KST 16:37, 17:37 backup
  repository_dispatch:
    types: [threads-publish] # Vercel 크론(api/threads-cron.py) 평일 16:30 KST 정시 트리거
  workflow_run:
    workflows: ["종목 인덱스 빌드 (1년치)"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD (여러 날짜는 쉼표로), blank = today. Historical dates generate previews only.'
        default: ''
        type: string
      publish:
        description: 'Publish to configured channels (today only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: orgo-marketing-daily
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
jobs:
  daily:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate date and final data
        id: gate
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'JS'
          const fs=require('fs'),tg=require('./scripts/tg_common');
          // 쉼표로 여러 날짜 — 과거 원고 일괄 재생성(미리보기 전용, 발행 없음)
          const requested=(process.env.REQUESTED_DATE||tg.ymdKst()).split(/[\s,]+/).filter(Boolean);
          if(!requested.length||requested.some(d=>!/^\d{8}$/.test(d)))throw Error('Invalid date');
          const manual=process.env.EVENT_NAME==='workflow_dispatch';
          const inWindow=tg.hmKst()>='16:20'&&tg.hmKst()<='22:00';
          const ok=d=>{const p=`public/data/rise-history/${d}.json`;const day=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):null;return tg.isKrTradingDay(d)&&tg.krCalendarCovers(d)&&day&&day.is_final===true;};
          tg.logHolidayWarnings(tg.ymdKst());
          const dates=[...new Set(requested)].sort().filter(d=>(manual||inWindow)&&ok(d));
          const date=dates[dates.length-1]||requested[0];
          const live=dates.length===1&&date===tg.ymdKst();
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${dates.length>0}\ndate=${date}\ndates=${dates.join(' ')}\nlive=${live}\n`);
          if(!dates.length)console.log('No current final trading data / outside window: skipped');
          else console.log('dates: '+dates.join(' '));
          JS
      - name: Generate short captions and visual topics
        if: steps.gate.outputs.run == 'true'
        env:
          DATES: ${{ steps.gate.outputs.dates }}
        run: for D in $DATES; do node scripts/marketing_digest.js "$D"; done
      # 텍스트+링크 카드라 이미지 렌더를 기다리지 않는다. 실패해도 이미지·발행실 배포는 계속(알림은 스크립트가 보냄)
      # 실게시는 vars.THREADS_AUTOPUBLISH == 'on' + 오늘 마감 확정일 때만, 그 외엔 dry-run 으로 본문만 로그에 남긴다
      - name: Publish Threads text post
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          DATE: ${{ steps.gate.outputs.date }}
          DRY_RUN: ${{ !(steps.gate.outputs.live == 'true' && vars.THREADS_AUTOPUBLISH == 'on' && (github.event_name != 'workflow_dispatch' || inputs.publish)) && '--dry-run' || '' }}
          RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '--retry-failed' || '' }}
          GH_TOKEN: ${{ github.token }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS_ALERT_CHAT_ID: ${{ secrets.THREADS_ALERT_CHAT_ID }}
        run: node scripts/threads_publish.js "$DATE" $DRY_RUN $RETRY_FAILED
      - name: Export native ORGO charts and calendar
        if: steps.gate.outputs.run == 'true'
        env:
          DATES: ${{ steps.gate.outputs.dates }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          for D in $DATES; do node scripts/marketing_render.js "$D"; done
          node scripts/test_marketing_ui.js
      - name: Deploy images before publication
        id: deploy
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/marketing/
          git diff --staged --quiet && exit 0
          git commit -m 'build: ORGO daily marketing'
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
      - name: Publish configured channels
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.live == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          DATE: ${{ steps.gate.outputs.date }}
          GH_TOKEN: ${{ github.token }}
          MARKETING_ENABLED_CHANNELS: ${{ vars.MARKETING_ENABLED_CHANNELS }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # 선택: 블로그 원고 준비 알림을 받을 운영자 텔레그램 chat id (봇에게 먼저 /start)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: node scripts/marketing_publish.js "$DATE"
      - name: Save publication status
        if: always() && steps.deploy.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/marketing/status.json
          git diff --staged --quiet && exit 0
          git commit -m 'build: ORGO daily marketing'
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
      # 거래일·게시 여부와 무관하게 만료일 확인 — 10일 이하로 남으면 갱신해 THREADS_ACCESS_TOKEN 시크릿을 덮어쓴다
      # 빌드 완료 트리거(장중 15분마다)는 빼고 크론·Vercel·수동 실행에서만 → 평일 하루 1~3번
      - name: Check Threads token expiry
        if: ${{ !cancelled() && github.event_name != 'workflow_run' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_SECRET_PAT: ${{ secrets.THREADS_SECRET_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREADS_ALERT_CHAT_ID: ${{ secrets.THREADS_ALERT_CHAT_ID }}
        run: node scripts/threads_token.js
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: orgo-marketing-${{ steps.gate.outputs.date }}
          path: public/marketing/
          retention-days: 14
